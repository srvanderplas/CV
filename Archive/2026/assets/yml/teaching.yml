textbook:
  title: (OER) Statistical Computing in R and Python
  description: Free, open educational resource hosted on GitHub for learning R and python for statistical computing. Initially developed as a graduate textbook, then reformulated to serve as a text for both graduate and undergraduate statistical computing courses.
  details:
    - Used at CalPoly, Arizona State University, Chadron State University, and University of Nebraska Lincoln.
    - Worked with an undergraduate student to develop an R package to turn textbooks like this into audiobooks through Google Summer of Code. Package and audiobook development were successful but then were not allowed to be used due to Title II compliance concerns. 

unlstat850:
  title: Computing Tools for Statistics
  description: Graduate 2-credit computing course for majors and nonmajors. Covered skills in statistical programming, document preparation, and data visualization. 
  details:
    - Developed hybrid flipped-classroom version in response to COVID. Evaluations were positive and students who previously struggled seemed to experience less programming anxiety.
    - Redesigned class to teach R and python simultaneously (2022) 
    - Initial course responsible for development of the OER
    - Taught 2020 (R/SAS), 2021 (R/SAS), 2022, 2023, 2025

unlstatcomputing:
  title: Undergraduate Statistical Computing and Technical Skills Sequence
  description: A four-course, ten-credit sequence teaching R and python programming for data wrangling, data visualization, web scraping and data management, and technical communication. Developed as a sequence using backwards design for each course. Project-based courses featuring flipped-classroom and traditional active-learning design patterns with significant project activities designed so that students graduate with a portfolio of projects to demonstrate technical competency. All courses used OERs, with most courses using Statistical Computing in R and Python, supplemented by other OER materials as available. 
  details:
    - Introduction to Statistical Computing (1 cr) - Taught 2022, 2023, 2024, 2025
    - Statistical Computing I: Data Wrangling (3 cr) - Taught 2023, 2024. Project: Screencast the cleaning and exploratory data analysis of a publicly available dataset.
    - Technical Skills for Statisticians (3 cr) - Taught 2025, 2026. Project 1: Create a portfolio featuring projects from past courses. Project 2: Write a business report addressing one of four questions, breaking down the question into analyzable components, and presenting the business case for a decision. 
    - Statistical Computing II: Data Management and Visualization (3 cr) - Taught 2025. Project: Create an interactive data visualziation using publicly available data scraped from the internet, cleaned, and formatted appropriately. 
