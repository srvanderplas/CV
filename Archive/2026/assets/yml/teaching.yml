unlstat992: 
  title: Special Topics in Data Visualization
  description: How to create good charts, theoretical basis for graph design, and how we test statistical graphics. 3 hour seminar.
  details:
    - Graduate MS/PhD seminar-style reading course offered in Fall 2024.

unlstat892:
  title: Writing in Statistics/TA Prep
  description: 1-hour graduate seminar preparing students to teach statistics courses using reflective writing, simulation, and in-class active learning exercises.
  
unlstat892:
  title: Data Technologies for Statistical Analysis
  description: Development of statistical software packages and interactive web applications, using R and assorted R packages.
  details:
    - Graduate MS/PhD course, co-taught at UNL and Iowa State University in hybrid synchronous format. Unpaid overload to provide students with skills necessary for research.
    - Taught 2023

unlstat982:
  title: Advanced Inference
  description: Graduate statistical theory underlying inference methods, including decision theory, estimation, admissibility, large sample theory, properties of maximum likelihood estimators, and other estimation methods. 
  details:
    - Co-taught as unpaid overload with another instructor to ensure students could graduate on time.

unlstat218:
  title: Introduction to Statistics
  description: General education quantitative literacy course using simulation-based methods to teach introductory statistics. 
  details:
    - Taught in-person/hybrid Spring 2020, online asynchronous 2021-2022
    - Coordinated graduate TA led sections, 2023-2025.

rworkshops:
  title: A Week of R
  description: A weeklong workshop introducing researchers and students to R for research data analysis, data visualization, and modeling. 
  details:
    - Taught as a graduate student at Iowa State, 2011-2015
    - Coordinated the workshop at UNL, 2021-2023
